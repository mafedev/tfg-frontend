name: tfg_frontend
description: "Proyecto TFG frontend"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.0.4
  flutter_secure_storage: ^9.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  table_calendar: ^3.1.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/logo/
